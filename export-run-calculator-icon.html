<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Экспорт иконки бегового калькулятора в PNG 1024×1024</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 24px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      max-width: 720px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }
    p {
      margin: 8px 0 16px;
      line-height: 1.45;
      color: #334155;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      background: #1e40af;
      color: #ffffff;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    canvas {
      display: block;
      margin-top: 18px;
      width: 256px;
      height: 256px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background:
        linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
        linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
        linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Экспорт первоначальной иконки в PNG 1024×1024</h1>
    <p>
      Нажми кнопку, чтобы сохранить файл <code>run-calculator-icon-1024.png</code>.
      Превью ниже показывает результат перед скачиванием.
    </p>

    <button id="downloadBtn">Скачать PNG 1024×1024</button>
    <div class="status" id="status">Готово к экспорту.</div>

    <canvas id="preview" width="1024" height="1024"></canvas>
  </div>

  <script>
    const originalSvg = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="iconTitle iconDesc">
  <title id="iconTitle">Иконка бегового калькулятора</title>
  <desc id="iconDesc">Упрощённый калькулятор на фоне и бегущий человек сбоку на переднем плане.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Фон иконки -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>

  <!-- Калькулятор на фоне -->
  <g filter="url(#softShadow)">
    <rect x="96" y="80" width="320" height="352" rx="36" fill="#ffffff"/>
  </g>

  <rect x="96" y="80" width="320" height="352" rx="36" fill="none" stroke="#bfdbfe" stroke-width="4"/>

  <!-- Экран калькулятора -->
  <rect x="128" y="112" width="256" height="72" rx="16" fill="#0f172a"/>

  <!-- Условные цифры на экране -->
  <g fill="#34d399">
    <rect x="152" y="134" width="34" height="28" rx="6"/>
    <rect x="198" y="134" width="34" height="28" rx="6"/>
    <rect x="244" y="134" width="34" height="28" rx="6"/>
    <rect x="290" y="134" width="34" height="28" rx="6"/>
  </g>

  <!-- Кнопки калькулятора -->
  <g fill="#e2e8f0">
    <rect x="140" y="212" width="64" height="52" rx="14"/>
    <rect x="224" y="212" width="64" height="52" rx="14"/>
    <rect x="308" y="212" width="64" height="52" rx="14"/>

    <rect x="140" y="282" width="64" height="52" rx="14"/>
    <rect x="224" y="282" width="64" height="52" rx="14"/>
    <rect x="308" y="282" width="64" height="52" rx="14"/>

    <rect x="140" y="352" width="64" height="52" rx="14"/>
    <rect x="224" y="352" width="64" height="52" rx="14"/>
    <rect x="308" y="352" width="64" height="52" rx="14"/>
  </g>

  <!-- Лёгкая тень под бегуном -->
  <ellipse cx="262" cy="410" rx="94" ry="12" fill="#0f172a" opacity="0.12"/>

  <!-- Бегущий человек, вид сбоку -->
  <g stroke="#f97316" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Корпус -->
    <path d="M306 236 L276 306"/>

    <!-- Передняя рука -->
    <path d="M306 236 L348 258 L356 226"/>

    <!-- Задняя рука -->
    <path d="M306 236 L264 262 L246 228"/>

    <!-- Передняя нога -->
    <path d="M276 306 L332 338 L320 402"/>

    <!-- Задняя нога -->
    <path d="M276 306 L224 344 L176 368"/>
  </g>

  <!-- Голова бегуна -->
  <circle cx="320" cy="205" r="30" fill="#f97316"/>
</svg>
`.trim();

    const button = document.getElementById("downloadBtn");
    const status = document.getElementById("status");
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");

    function prepareSvgForExport(svgText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, "image/svg+xml");
      const root = doc.documentElement;

      root.setAttribute("width", "1024");
      root.setAttribute("height", "1024");
      root.setAttribute("viewBox", "0 0 512 512");

      return new XMLSerializer().serializeToString(root);
    }

    async function exportPng() {
      try {
        button.disabled = true;
        status.textContent = "Рендерю PNG...";

        const svgText = prepareSvgForExport(originalSvg);
        const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.width = 1024;
        img.height = 1024;

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("Не удалось загрузить SVG в браузер."));
          img.src = url;
        });

        ctx.clearRect(0, 0, 1024, 1024);
        ctx.drawImage(img, 0, 0, 1024, 1024);

        URL.revokeObjectURL(url);

        const dataUrl = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.download = "run-calculator-icon-1024.png";
        link.href = dataUrl;
        link.click();

        status.textContent = "PNG 1024×1024 сохранён.";
      } catch (error) {
        console.error(error);
        status.textContent = "Ошибка экспорта: " + error.message;
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", exportPng);
  </script>
</body>
</html>
