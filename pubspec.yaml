name: ultra_run_calc
description: Ultra Run Calc - running pace calculator for trail ultras.
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: ^3.9.0

dependencies:
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
